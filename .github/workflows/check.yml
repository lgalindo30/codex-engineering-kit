name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.event.deleted == false && github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun run release:check-range "$KIT_RELEASE_BASE" "$KIT_RELEASE_HEAD"
        env:
          KIT_RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          KIT_RELEASE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run security:check
